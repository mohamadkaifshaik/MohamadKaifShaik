<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="mks-hero-title mks-hero-desc">
  <title id="mks-hero-title">Mohamad Kaif Shaik — AI/ML Engineer, Full-Stack Developer, Creative Technologist (static version)</title>
  <desc id="mks-hero-desc">Burgundy editorial hero banner with a fine technical grid, orbital geometry and a flowing animated line.</desc>

  <defs>
    
    <linearGradient id="mks-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C" />
      <stop offset="0.6" stop-color="#190B12" />
      <stop offset="1" stop-color="#451126" />
    </linearGradient>

    
    <radialGradient id="mks-hero-glow-a" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.6" />
      <stop offset="0.45" stop-color="#451126" stop-opacity="0.25" />
      <stop offset="1" stop-color="#10070C" stop-opacity="0" />
      </radialGradient>

    
    <radialGradient id="mks-hero-glow-b" cx="0.08" cy="1" r="0.45">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.22" />
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0" />
      </radialGradient>

    
    <pattern id="mks-hero-grid-minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#C77B9B" stroke-opacity="0.10" stroke-width="0.6" />
    </pattern>
    <pattern id="mks-hero-grid-major" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#E5B5C7" stroke-opacity="0.14" stroke-width="0.8" />
    </pattern>

    
    <linearGradient id="mks-hero-grid-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
    <mask id="mks-hero-grid-mask">
      <rect width="1200" height="420" fill="url(#mks-hero-grid-fade)" />
    </mask>

    
    <linearGradient id="mks-hero-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3" />
      <stop offset="0.38" stop-color="#E5B5C7" />
      <stop offset="0.5" stop-color="#F8F0F3" />
      <stop offset="0.62" stop-color="#C77B9B" />
      <stop offset="1" stop-color="#F8F0F3" />
      </linearGradient>

    
    <linearGradient id="mks-hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" />
      <stop offset="0.5" stop-color="#C77B9B" />
      <stop offset="1" stop-color="#E5B5C7" />
    </linearGradient>
    <linearGradient id="mks-hero-rule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0" />
      <stop offset="0.5" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0" />
    </linearGradient>

    
    <filter id="mks-hero-blur-sm" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="mks-hero-blur-dot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  
  <rect width="1200" height="420" rx="20" fill="url(#mks-hero-bg)" />
  <rect width="1200" height="420" rx="20" fill="url(#mks-hero-glow-a)" />
  <rect width="1200" height="420" rx="20" fill="url(#mks-hero-glow-b)" />
  <g mask="url(#mks-hero-grid-mask)">
    <rect width="1200" height="420" rx="20" fill="url(#mks-hero-grid-minor)" />
    <rect width="1200" height="420" rx="20" fill="url(#mks-hero-grid-major)" />
  </g>

  
  <g fill="none" stroke="#C77B9B" stroke-opacity="0.55" stroke-width="1">
    <path d="M30 46V30H46" />
    <path d="M1154 30H1170V46" />
    <path d="M30 374V390H46" />
    <path d="M1154 390H1170V374" />
  </g>

  
  <g transform="translate(965 212)">
    
    <g>
      <circle r="156" fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="0.9" stroke-dasharray="1.5 9" />
      </g>
    
    <circle r="104" fill="none" stroke="#E5B5C7" stroke-opacity="0.18" stroke-width="0.8" />
    
    <circle r="54" fill="none" stroke="#701A3D" stroke-opacity="0.9" stroke-width="1" />

    
    <g transform="rotate(-24)">
      <ellipse rx="214" ry="66" fill="none" stroke="#E5B5C7" stroke-opacity="0.28" stroke-width="0.9" />
      <g transform="translate(214 0)">
        <circle r="7" fill="#F8F0F3" opacity="0.55" filter="url(#mks-hero-blur-dot)" />
        <circle r="3" fill="#F8F0F3" />
        </g>
      </g>

    
    <g transform="translate(-104 0)">
      <circle r="2.6" fill="#C77B9B" />
      </g>

    
    <circle r="7" fill="#701A3D">
      </circle>
    <circle r="2.4" fill="#F8F0F3" />
    
    <g stroke="#E5B5C7" stroke-opacity="0.5" stroke-width="0.8">
      <path d="M-170 0H-160M160 0H170M0 -170V-160M0 160V170" />
    </g>
  </g>

  
  <path d="M-10 336C150 258 300 420 520 342S880 252 1210 334" fill="none" stroke="url(#mks-hero-line)" stroke-width="1.4" stroke-linecap="round" opacity="0.8" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0">
    </path>
  <path d="M-10 350C150 272 300 434 520 356S880 266 1210 348" fill="none" stroke="#E5B5C7" stroke-width="1.6" stroke-linecap="round" opacity="0.45" pathLength="1000" stroke-dasharray="1.5 12" stroke-dashoffset="0">
    </path>

  
  
  <rect x="48" y="92" width="1" height="226" fill="url(#mks-hero-rule)" />

  
  <text x="72" y="120" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" letter-spacing="3.2" fill="#C77B9B">AI/ML ENGINEER  ·  FULL-STACK DEVELOPER  ·  CREATIVE TECHNOLOGIST</text>

  
  <text x="70" y="202" font-family="Georgia,'Times New Roman','Playfair Display','Iowan Old Style',serif" font-size="70" letter-spacing="-1.2" fill="url(#mks-hero-sheen)">Mohamad Kaif <tspan font-style="italic">Shaik</tspan></text>

  
  <rect x="72" y="222" width="340" height="2.5" rx="1.25" fill="url(#mks-hero-line)" filter="url(#mks-hero-blur-sm)" opacity="0.9">
    </rect>
  <rect x="72" y="222.5" width="340" height="1.4" rx="0.7" fill="url(#mks-hero-line)">
    </rect>

  
  <text x="72" y="266" font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17.5" fill="#E5B5C7" opacity="0.92">Turning data into deployed, production-ready systems.</text>
  <text x="72" y="302" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" letter-spacing="2.4" fill="#C77B9B" opacity="0.85">BANGALORE, INDIA  ·  MCA, SRI VENKATESWARA UNIVERSITY</text>

  
  <text x="1136" y="394" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="1.5" fill="#C77B9B" opacity="0.7">12.97° N  ·  77.59° E</text>
</svg>
