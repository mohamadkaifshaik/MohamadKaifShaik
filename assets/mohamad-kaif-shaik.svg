<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="mks-hero-title mks-hero-desc">
  <title id="mks-hero-title">Mohamad Kaif Shaik — AI/ML Engineer, Full-Stack Developer, Creative Technologist</title>
  <desc id="mks-hero-desc">Deep-space sapphire hero banner with a sparse star field, nebula glow, orbital geometry and a flowing animated line.</desc>

  <defs>
    <!-- Background -->
    <linearGradient id="mks-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A1A"/>
      <stop offset="0.6" stop-color="#0B1430"/>
      <stop offset="1" stop-color="#143A8C"/>
    </linearGradient>

    <!-- Slow-breathing sapphire glow behind the orbital geometry -->
    <radialGradient id="mks-hero-glow-a" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#143A8C" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#050A1A" stop-opacity="0"/>
      <animate attributeName="r" values="0.42;0.56;0.42" dur="10s" repeatCount="indefinite"/>
    </radialGradient>

    <!-- Soft ice bloom bottom-left -->
    <radialGradient id="mks-hero-glow-b" cx="0.08" cy="1" r="0.45">
      <stop offset="0" stop-color="#8FC3FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8FC3FF" stop-opacity="0"/>
      <animate attributeName="cx" values="0.06;0.14;0.06" dur="14s" repeatCount="indefinite"/>
    </radialGradient>

    <!-- Nebula glow behind the typography -->
    <radialGradient id="mks-hero-nebula" cx="0.22" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#143A8C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050A1A" stop-opacity="0"/>
      <animate attributeName="cy" values="0.40;0.48;0.40" dur="16s" repeatCount="indefinite"/>
    </radialGradient>

    <!-- Moving starlight/ice sheen across the name -->
    <linearGradient id="mks-hero-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F7FF"/>
      <stop offset="0.38" stop-color="#C9E4FF"/>
      <stop offset="0.5" stop-color="#F2F7FF"/>
      <stop offset="0.62" stop-color="#8FC3FF"/>
      <stop offset="1" stop-color="#F2F7FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Line gradient for paths, underline and rules -->
    <linearGradient id="mks-hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.5" stop-color="#8FC3FF"/>
      <stop offset="1" stop-color="#C9E4FF"/>
    </linearGradient>
    <linearGradient id="mks-hero-rule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8FC3FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8FC3FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="mks-hero-blur-sm" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="mks-hero-blur-dot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ===== Background layers ===== -->
  <rect width="1200" height="420" rx="20" fill="url(#mks-hero-bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#mks-hero-glow-a)"/>
  <rect width="1200" height="420" rx="20" fill="url(#mks-hero-glow-b)"/>
  <rect width="1200" height="420" rx="20" fill="url(#mks-hero-nebula)"/>

