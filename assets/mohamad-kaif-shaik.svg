  <!-- Editorial crop marks -->
  <g fill="none" stroke="#8FC3FF" stroke-opacity="0.55" stroke-width="1">
    <path d="M30 46V30H46"/>
    <path d="M1154 30H1170V46"/>
    <path d="M30 374V390H46"/>
    <path d="M1154 390H1170V374"/>
  </g>

  <!-- ===== Orbital geometry ===== -->
  <g transform="translate(965 212)">
    <!-- Outer dotted ring, slow rotation -->
    <g>
      <circle r="156" fill="none" stroke="#8FC3FF" stroke-opacity="0.35" stroke-width="0.9" stroke-dasharray="1.5 9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
    </g>
    <!-- Mid ring -->
    <circle r="104" fill="none" stroke="#C9E4FF" stroke-opacity="0.18" stroke-width="0.8"/>
    <!-- Inner ring -->
    <circle r="54" fill="none" stroke="#2F6BFF" stroke-opacity="0.9" stroke-width="1"/>

    <!-- Tilted orbit with a travelling satellite -->
    <g transform="rotate(-24)">
      <ellipse rx="214" ry="66" fill="none" stroke="#C9E4FF" stroke-opacity="0.28" stroke-width="0.9"/>
      <g>
        <circle r="7" fill="#F2F7FF" opacity="0.55" filter="url(#mks-hero-blur-dot)"/>
        <circle r="3" fill="#F2F7FF"/>
        <animateMotion dur="16s" repeatCount="indefinite" path="M214 0A214 66 0 1 1 -214 0A214 66 0 1 1 214 0"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="-24;-18;-24" dur="22s" repeatCount="indefinite"/>
    </g>

    <!-- Secondary satellite on the mid ring, counter-direction -->
    <g>
      <circle r="2.6" fill="#8FC3FF"/>
      <animateMotion dur="11s" repeatCount="indefinite" path="M-104 0A104 104 0 1 0 104 0A104 104 0 1 0 -104 0"/>
    </g>

    <!-- Core -->
    <circle r="7" fill="#2F6BFF">
      <animate attributeName="r" values="6;8.5;6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" fill="#F2F7FF"/>
    <!-- Crosshair ticks -->
    <g stroke="#C9E4FF" stroke-opacity="0.5" stroke-width="0.8">
      <path d="M-170 0H-160M160 0H170M0 -170V-160M0 160V170"/>
    </g>
  </g>

  <!-- ===== Flowing animated path ===== -->
  <path d="M-10 336C150 258 300 420 520 342S880 252 1210 334" fill="none" stroke="url(#mks-hero-line)" stroke-width="1.4" stroke-linecap="round" opacity="0.8" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="3.2s" fill="freeze"/>
  </path>
  <path d="M-10 350C150 272 300 434 520 356S880 266 1210 348" fill="none" stroke="#C9E4FF" stroke-width="1.6" stroke-linecap="round" opacity="0.45" pathLength="1000" stroke-dasharray="1.5 12" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="13.5" to="0" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- ===== Typography ===== -->
  <!-- Margin rule -->
  <rect x="48" y="92" width="1" height="226" fill="url(#mks-hero-rule)"/>

  <!-- Role line -->
  <text x="72" y="120" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" letter-spacing="3.2" fill="#8FC3FF">AI/ML ENGINEER  ·  FULL-STACK DEVELOPER  ·  CREATIVE TECHNOLOGIST</text>

  <!-- Name -->
  <text x="70" y="202" font-family="Georgia,'Times New Roman','Playfair Display','Iowan Old Style',serif" font-size="70" letter-spacing="-1.2" fill="url(#mks-hero-sheen)">Mohamad Kaif <tspan font-style="italic">Shaik</tspan></text>

  <!-- Glowing underline -->
  <rect x="72" y="222" width="340" height="2.5" rx="1.25" fill="url(#mks-hero-line)" filter="url(#mks-hero-blur-sm)" opacity="0.9">
    <animate attributeName="width" values="0;0;340" keyTimes="0;0.25;1" dur="2.4s" fill="freeze"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="72" y="222.5" width="340" height="1.4" rx="0.7" fill="url(#mks-hero-line)">
    <animate attributeName="width" values="0;0;340" keyTimes="0;0.25;1" dur="2.4s" fill="freeze"/>
  </rect>

  <!-- Tagline -->
  <text x="72" y="266" font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17.5" fill="#C9E4FF" opacity="0.92">Turning data into deployed, production-ready systems.</text>
  <text x="72" y="302" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" letter-spacing="2.4" fill="#8FC3FF" opacity="0.85">BANGALORE, INDIA  ·  MCA, SRI VENKATESWARA UNIVERSITY</text>

  <!-- Coordinates, bottom-right -->
  <text x="1136" y="394" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" letter-spacing="1.5" fill="#8FC3FF" opacity="0.7">12.97° N  ·  77.59° E</text>
